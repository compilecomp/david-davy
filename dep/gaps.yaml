    node: C-0004
    missing: >
      The tensor-power argument from R(<2,2,2>) <= 7 to omega <= log_2 7 uses
      submultiplicativity R(S tensor T) <= R(S) R(T) and the definition of omega as an
      infimum over powers. Neither is formalized in this repository; the inference is
      recorded, not discharged.
    blast_radius: [C-0004, certs/analysis/strassen_power_bound.json]
    owner: repo-maintainer
    ticket: OMEGA-1
    opened: 2026-11-07
    expires: 2027-05-07
    status: open
    downgrades: {C-0004: proved-modulo}
    target: 'Omega/Analysis/SumIneq.lean or Omega/Tensor/Basic.lean (Mathlib layer)'

